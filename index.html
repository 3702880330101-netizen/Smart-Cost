<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Costos y Sincronización con Colab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">Calculadora de Costos Industriales</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Modifica los parámetros según el modelo de costos y envíalos a Google Colab</p>
        
        <form id="costForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Material -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Material (Descripción)</label>
                <input type="text" id="material" name="material" value="Acero Inoxidable" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <!-- Consumo estándar -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Consumo estándar</label>
                <input type="number" step="0.01" id="consumo_estandar" name="consumo_estandar" value="1.0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <!-- Precio material -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Precio del material ($)</label>
                <input type="number" step="0.01" id="precio_material" name="precio_material" value="50.00" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <!-- Desperdicio -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Desperdicio (%)</label>
                <input type="number" step="0.1" id="desperdicio" name="desperdicio" value="5.0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <!-- Horas MOD -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Horas MOD</label>
                <input type="number" step="0.1" id="horas_mod" name="horas_mod" value="2.5" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <!-- Tarifa MOD -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Tarifa MOD ($/hora)</label>
                <input type="number" step="0.01" id="tarifa_mod" name="tarifa_mod" value="15.00" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <!-- CIF variable -->
            <div>
                <label class="block text-sm font-medium text-gray-700">CIF variable ($)</label>
                <input type="number" step="0.01" id="cif_variable" name="cif_variable" value="10.00" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <!-- Costos fijos -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Costos fijos ($ totales)</label>
                <input type="number" step="0.01" id="costos_fijos" name="costos_fijos" value="5000.00" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <!-- Volumen -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Volumen / Unidades producidas</label>
                <input type="number" id="volumen" name="volumen" value="1000" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <!-- Precio venta -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Precio de venta unitario ($)</label>
                <input type="number" step="0.01" id="precio_venta" name="precio_venta" value="120.00" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>

            <!-- Configuración GitHub -->
            <div class="md:col-span-2 border-t pt-4 mt-2">
                <h3 class="text-lg font-medium text-gray-800 mb-3">Conexión con GitHub y Google Colab</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">GitHub Personal Access Token (PAT)</label>
                        <input type="password" id="github_token" placeholder="ghp_xxxxxxxxxxxx" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre del archivo JSON</label>
                        <input type="text" id="filename" value="costos_data.json" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                </div>
            </div>

            <!-- Botón Calcular -->
            <div class="md:col-span-2 flex flex-col sm:flex-row justify-between items-center gap-4 mt-4">
                <button type="button" id="calcBtn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-md shadow transition duration-200 cursor-pointer">
                    Calcular y Enviar a GitHub
                </button>
                <div id="statusMessage" class="text-sm text-gray-600"></div>
            </div>
        </form>

        <!-- Resultados -->
        <div id="results" class="mt-8 border-t pt-6 bg-gray-50 p-6 rounded-lg hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Resultados Verificables</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                <div class="bg-white p-4 rounded shadow-sm border">
                    <p class="text-sm text-gray-500">Costo Unitario</p>
                    <p id="res_costo_unit" class="text-lg font-bold text-indigo-600">$0.00</p>
                </div>
                <div class="bg-white p-4 rounded shadow-sm border">
                    <p class="text-sm text-gray-500">Utilidad</p>
                    <p id="res_utilidad" class="text-lg font-bold text-green-600">$0.00</p>
                </div>
                <div class="bg-white p-4 rounded shadow-sm border">
                    <p class="text-sm text-gray-500">Punto de Equilibrio (u.)</p>
                    <p id="res_pe" class="text-lg font-bold text-blue-600">0 un.</p>
                </div>
            </div>
            <div id="colabLinkContainer" class="mt-6 text-center hidden">
                <a id="colabLink" href="#" target="_blank" class="inline-block bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded shadow transition">
                    Abrir Google Colab con estos datos
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('calcBtn').addEventListener('click', async () => {
            const data = {
                material: document.getElementById('material').value,
                consumo_estandar: parseFloat(document.getElementById('consumo_estandar').value) || 0,
                precio_material: parseFloat(document.getElementById('precio_material').value) || 0,
                desperdicio: parseFloat(document.getElementById('desperdicio').value) || 0,
                horas_mod: parseFloat(document.getElementById('horas_mod').value) || 0,
                tarifa_mod: parseFloat(document.getElementById('tarifa_mod').value) || 0,
                cif_variable: parseFloat(document.getElementById('cif_variable').value) || 0,
                costos_fijos: parseFloat(document.getElementById('costos_fijos').value) || 0,
                volumen: parseFloat(document.getElementById('volumen').value) || 0,
                precio_venta: parseFloat(document.getElementById('precio_venta').value) || 0,
                timestamp: new Date().toISOString()
            };

            // Lógica exacta de la tabla de verificación
            const materialAjustado = data.consumo_estandar * (1 + (data.desperdicio / 100));
            const costoMpUnitario = materialAjustado * data.precio_material;
            const costoModUnitario = data.horas_mod * data.tarifa_mod;
            const costoVariableUnitario = costoMpUnitario + costoModUnitario + data.cif_variable;
            const costoTotal = (costoVariableUnitario * data.volumen) + data.costos_fijos;
            const costoUnitario = data.volumen > 0 ? costoTotal / data.volumen : 0;
            const margenContribucionUnitario = data.precio_venta - costoVariableUnitario;
            const puntoEquilibrio = margenContribucionUnitario > 0 ? Math.ceil(data.costos_fijos / margenContribucionUnitario) : 0;
            const utilidad = (margenContribucionUnitario * data.volumen) - data.costos_fijos;

            // Mostrar resultados en pantalla
            document.getElementById('res_costo_unit').textContent = `$${costoUnitario.toFixed(2)}`;
            document.getElementById('res_utilidad').textContent = `$${utilidad.toFixed(2)}`;
            document.getElementById('res_pe').textContent = `${puntoEquilibrio} un.`;
            document.getElementById('results').classList.remove('hidden');

            const token = document.getElementById('github_token').value.trim();
            const filename = document.getElementById('filename').value.trim() || 'costos_data.json';
            const statusMsg = document.getElementById('statusMessage');

            if (!token) {
                statusMsg.textContent = 'Cálculo local realizado. (Introduce tu Token de GitHub para sincronizar)';
                statusMsg.className = 'text-sm text-amber-600 font-medium';
                return;
            }

            statusMsg.textContent = 'Sincronizando con GitHub (Gist)...';
            statusMsg.className = 'text-sm text-blue-600 font-medium';

            try {
                const gistPayload = {
                    description: "Datos de Costos Industriales - Verificables",
                    public: false,
                    files: {
                        [filename]: {
                            content: JSON.stringify(data, null, 2)
                        }
                    }
                };

                const response = await fetch('https://api.github.com/gists', {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(gistPayload)
                });

                if (!response.ok) {
                    throw new Error(`Error en GitHub API: ${response.statusText}`);
                }

                const gistResult = await response.json();
                const rawUrl = gistResult.files[filename].raw_url;

                statusMsg.textContent = '¡Enviado a GitHub con éxito!';
                statusMsg.className = 'text-sm text-green-600 font-medium';

                const colabUrl = `https://colab.research.google.com/github/TU_USUARIO/TU_REPOSITORIO/blob/main/TU_CUADERNO.ipynb?raw_url=${encodeURIComponent(rawUrl)}`;
                
                const colabLink = document.getElementById('colabLink');
                colabLink.href = colabUrl;
                document.getElementById('colabLinkContainer').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                statusMsg.textContent = `Error al conectar con GitHub: ${error.message}`;
                statusMsg.className = 'text-sm text-red-600 font-medium';
            }
        });
    </script>
</body>
</html>
